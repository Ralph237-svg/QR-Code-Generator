<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Generator</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="QR CODE.css">
</head>
<body>
    <div class="card">
        <div class="animation">
        <h2>Smart QR Code Generator</h2>

        <p>Turn any link into QR code</p>

        <input type="url" id="link" placeholder="https://example.com">
        <div class="message"></div>

        <button onclick="generateQR()">Generate QR Code</button>
        
        <div id="qrcode"></div>

        <button id="download" onclick="downloadQR()">Download QR Code</button>
        </div>
    </div>
<script src="QR CODE.js"></script>
</body>
</html>
